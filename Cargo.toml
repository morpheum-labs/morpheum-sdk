[workspace]
members = [
    "crates/core",
    "crates/dao",
    "crates/gov",
    "crates/market",
    "crates/vc",
    "crates/auth",
    "crates/identity",
    "crates/reputation",
    "crates/intent",
    "crates/memory",
    "crates/validation",
    "crates/directory",
    "crates/marketplace",
    "crates/interop",
    "crates/agentreg",
    "crates/inferreg",
    "crates/job",
    "crates/bank",
    "crates/bondingcurve",
    "crates/bucket",
    "crates/staking",
    "crates/upgrade",
    "crates/x402",
    "crates/gmp",
    "crates/evm",
    "crates/fundingrate",
    "crates/insurance",
    "crates/kline",
    "crates/liquidity",
    "crates/markprice",
    "crates/osa",
    "crates/outcomefeed",
    "crates/prediction",
    "crates/pricefeed",
    "crates/risk",
    "crates/token",
    "crates/treasury",
    "crates/twap",
    "crates/vault",
    "crates/vesting",
    "crates/svm",
    "crates/cosmwasm",
    "crates/clmm",
    "crates/clmmgrad",
    "crates/native",
    "crates/clob",
    "crates/position",
    "crates/ws",
    "crates/wasm",
    "examples",
    "tests",
]
resolver = "2"

# `crates/cctp` is excluded, not deleted.
#
# It path-depends on `../../../contracts/cosmwasm/contracts/hpl-cctp-handler`
# — a Hyperlane CosmWasm contract crate that is not in this repo, not a
# sibling checkout, not a submodule, not in the morpheum-labs org, and not
# published on crates.io. There is no `Cargo.lock` in this workspace
# because it has never resolved: with cctp listed as a member, `cargo
# metadata` fails and therefore so does every cargo command, for all 50
# crates.
#
# Excluding it restores the other 49 (clippy: 0 errors, 0 warnings).
# Nothing depends on `morpheum-sdk-cctp`, so this costs no other crate;
# only CCTP support is unavailable.
#
# To restore it, the contract dependency has to be resolvable — as a git
# dependency pinned to the canonical Hyperlane revision, or vendored.
# Deliberately not guessed here: `cctp` exists to re-export the contract's
# canonical types (`pub use hpl_cctp_handler::state::PendingTransfer`)
# precisely so they cannot drift, and pointing it at the wrong revision
# would reintroduce that drift silently, which is worse than this build
# failing loudly.
exclude = ["crates/cctp"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
repository = "https://github.com/morpheum-labs/morpheum-sdk"
homepage = "https://morpheum.xyz"
keywords = ["blockchain", "morpheum", "sdk", "agent", "wallet"]
categories = ["cryptography", "api-bindings"]
readme = "README.md"

[workspace.dependencies]
# Core
morpheum-sdk-core = { path = "crates/core" }

# Canonical protobuf definitions (sibling repo)
morpheum-proto = { path = "../morpheum-proto", default-features = false }

# Signing (the official Morpheum signing library — local sibling repo)
morpheum-signing-core = { path = "../morpheum-signing/crates/core", default-features = false, features = ["std"] }
morpheum-signing-native = { path = "../morpheum-signing/crates/native", features = ["full"] }
morpheum-signing-wasm-lib = { path = "../morpheum-signing/crates/wasm-lib" }

# EVM interaction
morpheum-sdk-evm = { path = "crates/evm" }

# SVM (Solana) interaction
morpheum-sdk-svm = { path = "crates/svm" }

# CosmWasm contract interaction (on Morpheum)
morpheum-sdk-cosmwasm = { path = "crates/cosmwasm" }

# CCTP handler contract interaction (canonical types + typed queries).
# Commented out with the crate itself — see the `exclude` note above.
# morpheum-sdk-cctp = { path = "crates/cctp" }

# WebSocket streaming client
morpheum-sdk-ws = { path = "crates/ws" }

# Shared primitives (sibling repo)
morpheum-primitives = { path = "../morpheum-primitives", default-features = false }

# Shared dependencies
prost = { version = "0.14", default-features = false, features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tonic = { version = "0.14", features = ["transport"] }
serde_json = "1.0"

# WASM-only
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
tsify = { version = "0.4", features = ["js"] }
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
web-sys = { version = "0.3", features = ["Window", "Navigator", "console"] }
console_error_panic_hook = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
